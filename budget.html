<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearth — a cozy ledger for college life</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap');

  :root{
    --paper: #E7DFCF;
    --paper-2: #DED4BF;
    --card: #F6F1E5;
    --card-soft: #F0E9DA;
    --ink: #3B3129;
    --ink-soft: #7A6E5E;
    --ink-faint: #A79B87;
    --line: #D7CBAF;
    --amber: #BE7639;
    --amber-deep: #96592A;
    --amber-pale: #EAD3B4;
    --sage: #74815F;
    --sage-pale: #DCE3CE;
    --rust: #AE4F37;
    --rust-pale: #EBD2C7;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow: 0 2px 0 rgba(59,49,41,0.05), 0 10px 24px -14px rgba(59,49,41,0.35);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(59,49,41,0.05) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  h1,h2,h3,.display{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0;
  }

  button{ font-family: inherit; }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 36px 20px 80px;
  }

  /* ---------- Header ---------- */
  .header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .flame{
    width: 30px; height: 34px;
    display:block;
    flex-shrink: 0;
  }
  .brand-text h1{
    font-size: 30px;
    line-height: 1;
  }
  .brand-text p{
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    font-family: 'Fraunces', serif;
  }
  .month-picker{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px 6px 16px;
    box-shadow: var(--shadow);
  }
  .month-picker span{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    min-width: 122px;
    text-align: center;
  }
  .month-picker button{
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 14px;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s ease;
  }
  .month-picker button:hover{ background: var(--amber-pale); }

  /* ---------- Summary cards ---------- */
  .summary{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .sum-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .sum-card .label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-soft);
    font-weight: 700;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .sum-card .amount{
    font-family:'Fraunces', serif;
    font-size: 30px;
    font-weight: 600;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .sum-card.balance .amount{ color: var(--amber-deep); }
  .sum-card.income .amount{ color: var(--sage); }
  .sum-card.expense .amount{ color: var(--rust); }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot.balance{ background: var(--amber); }
  .dot.income{ background: var(--sage); }
  .dot.expense{ background: var(--rust); }

  /* ---------- Jars section ---------- */
  .section-title{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title h2{ font-size: 19px; }
  .section-title .hint{ font-size:12px; color:var(--ink-faint); }
  .jars-shelf{
    background: var(--card-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 22px 18px 16px;
    margin-bottom: 30px;
    box-shadow: var(--shadow);
  }
  .jars-row{
    display:flex;
    gap: 22px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .jar-item{
    display:flex;
    flex-direction: column;
    align-items:center;
    flex-shrink:0;
    width: 82px;
  }
  .jar-svg{ width: 66px; height: 84px; overflow: visible; }
  .jar-name{
    font-size: 12px;
    font-weight: 700;
    margin-top: 8px;
    text-align:center;
  }
  .jar-figures{
    font-size: 11px;
    color: var(--ink-soft);
    text-align:center;
    font-variant-numeric: tabular-nums;
  }
  .jar-figures b{ color: var(--ink); }
  .jar-item.over .jar-figures{ color: var(--rust); }
  .jar-item.over .jar-name{ color: var(--rust); }

  .wave-bob{ animation: bob 3.4s ease-in-out infinite; transform-origin: center; }
  @keyframes bob{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-1.4px); }
  }

  .edit-budgets-btn{
    background: none;
    border: none;
    color: var(--amber-deep);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 0;
  }

  /* ---------- Layout: form + list ---------- */
  .grid{
    display:grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 760px){
    .grid{ grid-template-columns: 1fr; }
    .summary{ grid-template-columns: 1fr; }
  }

  .card-panel{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .card-panel h2{ font-size: 18px; margin-bottom: 4px; }
  .card-panel .sub{ font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .field input, .field select{
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--card-soft);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field select:focus{
    border-color: var(--amber);
    box-shadow: 0 0 0 3px var(--amber-pale);
  }

  .type-toggle{
    display:flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    background: var(--card-soft);
  }
  .type-toggle button{
    flex:1;
    border: none;
    background: transparent;
    padding: 8px 0;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s ease;
  }
  .type-toggle button.active.expense{ background: var(--rust); color: #fff; }
  .type-toggle button.active.income{ background: var(--sage); color: #fff; }

  .add-btn{
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--amber);
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
    transition: background .15s ease, transform .1s ease;
  }
  .add-btn:hover{ background: var(--amber-deep); }
  .add-btn:active{ transform: scale(0.98); }

  /* ---------- Transaction list ---------- */
  .day-group{ margin-bottom: 18px; }
  .day-group:last-child{ margin-bottom: 0; }
  .day-heading{
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .txn{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 10px;
    border-radius: var(--radius-md);
    transition: background .15s ease;
  }
  .txn:hover{ background: var(--card-soft); }
  .txn + .txn{ border-top: 1px dashed var(--line); }
  .cat-chip{
    width: 34px; height:34px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-size: 15px;
    flex-shrink:0;
  }
  .txn-info{ flex:1; min-width:0; }
  .txn-desc{ font-weight: 700; font-size: 14px; }
  .txn-cat{ font-size: 12px; color: var(--ink-soft); }
  .txn-amount{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .txn-amount.income{ color: var(--sage); }
  .txn-amount.expense{ color: var(--rust); }
  .txn-del{
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 16px;
    opacity: 0;
    transition: opacity .15s ease, color .15s ease;
    padding: 4px 6px;
  }
  .txn:hover .txn-del{ opacity: 1; }
  .txn-del:hover{ color: var(--rust); }

  .empty-state{
    text-align:center;
    padding: 50px 20px;
    color: var(--ink-soft);
  }
  .empty-state .glyph{ font-size: 30px; margin-bottom: 10px; }
  .empty-state p{ margin: 0; font-size: 14px; }
  .empty-state .sub2{ font-size: 12px; color: var(--ink-faint); margin-top: 4px; }

  /* ---------- Budget editor modal ---------- */
  .modal-overlay{
    position: fixed; inset:0;
    background: rgba(59,49,41,0.35);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .modal{
    background: var(--card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--line);
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px -20px rgba(59,49,41,0.5);
  }
  .modal h2{ font-size: 20px; margin-bottom: 4px; }
  .modal .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:18px; }
  .budget-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .budget-row .swatch{ width:12px; height:12px; border-radius:4px; flex-shrink:0; }
  .budget-row label{ flex:1; font-size:13px; font-weight:700; }
  .budget-row input{
    width: 90px;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card-soft);
    font-family: inherit;
    text-align: right;
  }
  .modal-actions{ display:flex; gap:10px; margin-top: 18px; }
  .modal-actions button{
    flex:1;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
  }
  .modal-actions .save{ background: var(--amber); color:#fff; border:none; }
  .modal-actions .save:hover{ background: var(--amber-deep); }
  .modal-actions .cancel{ background: var(--card-soft); color: var(--ink); }

  .save-note{
    font-size: 11px;
    color: var(--ink-faint);
    text-align:center;
    margin-top: 26px;
  }

  ::-webkit-scrollbar{ height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb{ background: var(--ink-faint); border-radius: 8px; }
  ::-webkit-scrollbar-track{ background: transparent; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------------------------------------------------------
   Hearth — a cozy personal budget & expense tracker
--------------------------------------------------------- */

const CATEGORIES = [
  { key: 'mess',    name: 'Mess & Food',   color: '#8C9E72', icon: '🍛' },
  { key: 'rent',    name: 'Hostel & Rent', color: '#9C6F4A', icon: '🏠' },
  { key: 'transport', name: 'Transport',   color: '#6E8B96', icon: '🚌' },
  { key: 'books',   name: 'Books & Stationery', color: '#B08F4E', icon: '📚' },
  { key: 'recharge', name: 'Recharge & Subscriptions', color: '#C17A3F', icon: '📱' },
  { key: 'fun',     name: 'Outings & Fun', color: '#B5566B', icon: '🎉' },
  { key: 'health',  name: 'Health & Essentials', color: '#6F9A82', icon: '🧴' },
  { key: 'other',   name: 'Other',         color: '#9A8C79', icon: '🧺' },
];
const DEFAULT_BUDGETS = { mess:3500, rent:5000, transport:800, books:500, recharge:400, fun:1000, health:500, other:500 };

let state = {
  transactions: [],
  budgets: { ...DEFAULT_BUDGETS },
  monthOffset: 0,   // 0 = current month
  loaded: false,
  showBudgetModal: false,
};

const fmt = (n) => {
  const sign = n < 0 ? '-' : '';
  return sign + '₹' + Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
};

function currentMonthDate(){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + state.monthOffset);
  return d;
}
function monthLabel(){
  return currentMonthDate().toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}
function isInSelectedMonth(dateStr){
  const t = new Date(dateStr + 'T00:00:00');
  const m = currentMonthDate();
  return t.getFullYear() === m.getFullYear() && t.getMonth() === m.getMonth();
}

function categoryOf(key){ return CATEGORIES.find(c => c.key === key) || CATEGORIES[CATEGORIES.length-1]; }

/* ---------------- storage ---------------- */
async function loadData(){
  try{
    const t = await window.storage.get('hearth:transactions');
    state.transactions = t ? JSON.parse(t.value) : sampleData();
  }catch(e){ state.transactions = sampleData(); }
  try{
    const b = await window.storage.get('hearth:budgets');
    state.budgets = b ? JSON.parse(b.value) : { ...DEFAULT_BUDGETS };
  }catch(e){ state.budgets = { ...DEFAULT_BUDGETS }; }
  state.loaded = true;
  render();
}
async function saveTransactions(){
  try{ await window.storage.set('hearth:transactions', JSON.stringify(state.transactions)); }
  catch(e){ console.error('Could not save transactions', e); }
}
async function saveBudgets(){
  try{ await window.storage.set('hearth:budgets', JSON.stringify(state.budgets)); }
  catch(e){ console.error('Could not save budgets', e); }
}

function sampleData(){
  const today = new Date();
  const iso = (d) => d.toISOString().slice(0,10);
  const day = (offset) => { const d = new Date(today); d.setDate(d.getDate()-offset); return iso(d); };
  return [
    { id: cryptoId(), date: day(1), desc: 'Canteen maggi run', category: 'mess', type: 'expense', amount: 90 },
    { id: cryptoId(), date: day(2), desc: 'Pocket money from home', category: 'other', type: 'income', amount: 6000 },
    { id: cryptoId(), date: day(2), desc: 'Hostel mess fee', category: 'rent', type: 'expense', amount: 3500 },
    { id: cryptoId(), date: day(3), desc: 'Chai with roomies', category: 'mess', type: 'expense', amount: 40 },
    { id: cryptoId(), date: day(4), desc: 'Tuition assignment help (freelance)', category: 'other', type: 'income', amount: 1200 },
    { id: cryptoId(), date: day(5), desc: 'Mobile recharge', category: 'recharge', type: 'expense', amount: 249 },
    { id: cryptoId(), date: day(6), desc: 'Auto to campus', category: 'transport', type: 'expense', amount: 60 },
    { id: cryptoId(), date: day(7), desc: 'Xerox & notebook', category: 'books', type: 'expense', amount: 180 },
    { id: cryptoId(), date: day(8), desc: 'Movie night with friends', category: 'fun', type: 'expense', amount: 350 },
  ];
}
function cryptoId(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ---------------- derived data ---------------- */
function monthTxns(){
  return state.transactions.filter(t => isInSelectedMonth(t.date));
}
function totals(){
  const txns = monthTxns();
  const income = txns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = txns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return { income, expense, balance: income - expense };
}
function spentByCategory(){
  const txns = monthTxns().filter(t=>t.type==='expense');
  const map = {};
  CATEGORIES.forEach(c => map[c.key] = 0);
  txns.forEach(t => { map[t.category] = (map[t.category]||0) + t.amount; });
  return map;
}

/* ---------------- rendering ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div style="text-align:center;padding:80px 0;color:var(--ink-soft);font-family:'Fraunces',serif;">warming the hearth…</div>`;
    return;
  }
  const t = totals();
  const spent = spentByCategory();

  app.innerHTML = `
    ${renderHeader()}
    ${renderSummary(t)}
    ${renderJars(spent)}
    <div class="grid">
      ${renderForm()}
      ${renderList()}
    </div>
    <p class="save-note">Kept just for you — saved automatically, visible only in this browser.</p>
  `;

  attachHeaderEvents();
  attachFormEvents();
  attachListEvents();

  if(state.showBudgetModal){
    renderBudgetModal();
  }
}

function renderHeader(){
  return `
  <div class="header">
    <div class="brand">
      <svg class="flame" viewBox="0 0 30 34" fill="none">
        <path d="M15 0C15 0 6 10 6 19C6 26.5 10 32 15 32C20 32 24 26.5 24 19C24 15 21.5 12 20 10C20.5 14 18 16 17 14C16.2 12.4 17 9 15 6C15.3 9 13 10.5 12.5 13.5C12 16.5 14 18 13 21C12.2 23.3 10 22.5 10 20C8.5 22.5 9.5 27 13.5 28.5C11 27.5 10 25 10.5 22.5C11.5 25.5 15 27 17.5 25C20 23 19.5 19.5 18 17.5C19.5 19 20.5 21.5 19 24" fill="#BE7639"/>
        <path d="M15 8C15 8 11 14 11 19C11 23 12.8 26 15 26C17.2 26 19 23 19 19C19 16.5 17.5 14.7 16.7 13.5C17 15.8 15.6 17 15 15.8C14.5 14.8 15 13 14 11.3C14.2 13 12.9 14 12.6 16C12.3 18 13.5 19 13 21C12.6 22.4 11.2 21.8 11.2 20" fill="#EAD3B4"/>
      </svg>
      <div class="brand-text">
        <h1>Hearth</h1>
      </div>
    </div>
    <div class="month-picker">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <span>${monthLabel()}</span>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>
  </div>`;
}

function renderSummary(t){
  return `
  <div class="summary">
    <div class="sum-card balance">
      <div class="label"><span class="dot balance"></span>Balance this month</div>
      <div class="amount">${fmt(t.balance)}</div>
    </div>
    <div class="sum-card income">
      <div class="label"><span class="dot income"></span>Income</div>
      <div class="amount">${fmt(t.income)}</div>
    </div>
    <div class="sum-card expense">
      <div class="label"><span class="dot expense"></span>Spent</div>
      <div class="amount">${fmt(t.expense)}</div>
    </div>
  </div>`;
}

function jarSVG(pct, color){
  const clamped = Math.max(0, Math.min(1, pct));
  const fillHeight = 58 * clamped; // inner liquid area height
  const fillY = 66 - fillHeight;
  return `
  <svg class="jar-svg" viewBox="0 0 66 84">
    <rect x="24" y="2" width="18" height="10" rx="3" fill="none" stroke="#3B3129" stroke-width="2.5"/>
    <path d="M14 12 H52 L48 76 Q48 80 44 80 H22 Q18 80 18 76 Z" fill="#F6F1E5" stroke="#3B3129" stroke-width="2.5"/>
    <clipPath id="clip-${color.replace('#','')}-${Math.round(clamped*1000)}">
      <path d="M14 12 H52 L48 76 Q48 80 44 80 H22 Q18 80 18 76 Z"/>
    </clipPath>
    <g clip-path="url(#clip-${color.replace('#','')}-${Math.round(clamped*1000)})">
      <g class="wave-bob">
        <rect x="10" y="${fillY}" width="46" height="70" fill="${color}" opacity="0.85"/>
        <ellipse cx="33" cy="${fillY}" rx="26" ry="4" fill="${color}"/>
      </g>
    </g>
  </svg>`;
}

function renderJars(spent){
  const jars = CATEGORIES.map(c => {
    const budget = state.budgets[c.key] || 0;
    const s = spent[c.key] || 0;
    const pct = budget > 0 ? s / budget : (s > 0 ? 1 : 0);
    const over = budget > 0 && s > budget;
    return `
    <div class="jar-item ${over ? 'over' : ''}">
      ${jarSVG(pct, c.color)}
      <div class="jar-name">${c.icon} ${c.name}</div>
      <div class="jar-figures"><b>${fmt(s)}</b>${budget ? ' / ' + fmt(budget) : ''}</div>
    </div>`;
  }).join('');

  return `
  <div class="jars-shelf">
    <div class="section-title">
      <h2>Your shelf of jars</h2>
      <button class="edit-budgets-btn" id="editBudgets">edit budgets</button>
    </div>
    <div class="jars-row">${jars}</div>
  </div>`;
}

function renderForm(){
  const catOptions = CATEGORIES.map(c => `<option value="${c.key}">${c.icon} ${c.name}</option>`).join('');
  return `
  <div class="card-panel">
    <h2>Add an entry</h2>
    <div class="sub">Pocket money in, canteen bill out — log it here.</div>
    <form id="txnForm">
      <div class="field">
        <label>Type</label>
        <div class="type-toggle">
          <button type="button" class="active expense" data-type="expense" id="typeExpense">Expense</button>
          <button type="button" class="income" data-type="income" id="typeIncome">Income</button>
        </div>
      </div>
      <div class="field">
        <label for="descInput">Description</label>
        <input id="descInput" type="text" placeholder="e.g. Canteen lunch" required />
      </div>
      <div class="field">
        <label for="amountInput">Amount</label>
        <input id="amountInput" type="number" min="0" step="1" placeholder="e.g. 90" required />
      </div>
      <div class="field" id="categoryField">
        <label for="categoryInput">Category</label>
        <select id="categoryInput">${catOptions}</select>
      </div>
      <div class="field">
        <label for="dateInput">Date</label>
        <input id="dateInput" type="date" value="${new Date().toISOString().slice(0,10)}" required />
      </div>
      <button type="submit" class="add-btn">Add to the ledger</button>
    </form>
  </div>`;
}

function renderList(){
  const txns = monthTxns().slice().sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  if(txns.length === 0){
    return `
    <div class="card-panel">
      <h2>This month's entries</h2>
      <div class="empty-state">
        <div class="glyph">🕯️</div>
        <p>No entries yet for ${monthLabel()}.</p>
        <div class="sub2">Log your first mess bill or pocket money — the jars are waiting.</div>
      </div>
    </div>`;
  }

  const groups = {};
  txns.forEach(t => { (groups[t.date] = groups[t.date] || []).push(t); });

  const groupsHtml = Object.keys(groups).map(date => {
    const label = new Date(date + 'T00:00:00').toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    const rows = groups[date].map(t => {
      const c = categoryOf(t.category);
      const sign = t.type === 'income' ? '+' : '−';
      return `
      <div class="txn" data-id="${t.id}">
        <div class="cat-chip" style="background:${c.color}22;">${c.icon}</div>
        <div class="txn-info">
          <div class="txn-desc">${escapeHtml(t.desc)}</div>
          <div class="txn-cat">${t.type === 'income' ? 'Income' : c.name}</div>
        </div>
        <div class="txn-amount ${t.type}">${sign}${fmt(t.amount)}</div>
        <button class="txn-del" data-id="${t.id}" aria-label="Delete entry">✕</button>
      </div>`;
    }).join('');
    return `<div class="day-group"><div class="day-heading">${label}</div>${rows}</div>`;
  }).join('');

  return `
  <div class="card-panel">
    <h2>This month's entries</h2>
    <div class="sub">${txns.length} ${txns.length===1?'entry':'entries'} in ${monthLabel()}</div>
    ${groupsHtml}
  </div>`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------------- events ---------------- */
function attachHeaderEvents(){
  document.getElementById('prevMonth').onclick = () => { state.monthOffset--; render(); };
  document.getElementById('nextMonth').onclick = () => { state.monthOffset++; render(); };
  document.getElementById('editBudgets').onclick = () => { state.showBudgetModal = true; render(); };
}

let selectedType = 'expense';
function attachFormEvents(){
  const expenseBtn = document.getElementById('typeExpense');
  const incomeBtn = document.getElementById('typeIncome');
  const categoryField = document.getElementById('categoryField');

  function setType(t){
    selectedType = t;
    expenseBtn.classList.toggle('active', t==='expense');
    incomeBtn.classList.toggle('active', t==='income');
    categoryField.style.display = t === 'income' ? 'none' : 'block';
  }
  expenseBtn.onclick = () => setType('expense');
  incomeBtn.onclick = () => setType('income');
  setType(selectedType);

  document.getElementById('txnForm').onsubmit = async (e) => {
    e.preventDefault();
    const desc = document.getElementById('descInput').value.trim();
    const amount = parseFloat(document.getElementById('amountInput').value);
    const category = document.getElementById('categoryInput').value;
    const date = document.getElementById('dateInput').value;
    if(!desc || isNaN(amount) || amount <= 0 || !date) return;

    state.transactions.push({
      id: cryptoId(),
      date,
      desc,
      category: selectedType === 'income' ? 'other' : category,
      type: selectedType,
      amount,
    });
    await saveTransactions();
    render();
  };
}

function attachListEvents(){
  document.querySelectorAll('.txn-del').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-id');
      state.transactions = state.transactions.filter(t => t.id !== id);
      await saveTransactions();
      render();
    };
  });
}

/* ---------------- budget modal ---------------- */
function renderBudgetModal(){
  const rows = CATEGORIES.map(c => `
    <div class="budget-row">
      <span class="swatch" style="background:${c.color}"></span>
      <label for="b-${c.key}">${c.icon} ${c.name}</label>
      <input id="b-${c.key}" type="number" min="0" step="1" value="${state.budgets[c.key] || 0}" />
    </div>`).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>Set monthly budgets</h2>
      <div class="sub">How far should this month's allowance stretch per jar?</div>
      ${rows}
      <div class="modal-actions">
        <button class="cancel" id="cancelBudgets">Cancel</button>
        <button class="save" id="saveBudgets">Save budgets</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', (e) => { if(e.target === overlay){ closeModal(); } });
  document.getElementById('cancelBudgets').onclick = closeModal;
  document.getElementById('saveBudgets').onclick = async () => {
    CATEGORIES.forEach(c => {
      const v = parseFloat(document.getElementById('b-'+c.key).value);
      state.budgets[c.key] = isNaN(v) ? 0 : v;
    });
    await saveBudgets();
    closeModal();
  };

  function closeModal(){
    state.showBudgetModal = false;
    overlay.remove();
    render();
  }
}

loadData();
</script>
</body>
</html>
